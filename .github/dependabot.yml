version: 2
updates:
  # Cargo dependency updates (Cargo.toml / Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  # GitHub Actions, pinned by commit SHA in every workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["actions/*", "github/*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["actions/*", "github/*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
