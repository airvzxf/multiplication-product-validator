name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the alerts stay current even when the repository is quiet.
    - cron: '32 14 * * 1'
  workflow_dispatch:

# `security-events: write` uploads the SARIF results to Code scanning.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 'CodeQL · ${{ matrix.language }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves (injection, permissions).
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # The Rust extractor only supports `build-mode: none`.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
