name: release-plz

# Opens (or updates) a release PR that bumps the version in Cargo.toml and
# adds the CHANGELOG.md entries derived from the Conventional Commits since
# the last `vX.Y.Z` tag. It never tags or publishes; see release-plz.toml
# and release.yml for the rest of the release flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-pr:
    name: 'release-plz · release PR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Do not run on forks.
    if: github.repository_owner == 'airvzxf'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads the full history and the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@8e61445f0b34e7c6d985255f2f1f05a36eb350dc # v0.5.137
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
